<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Product-Cards</title>
</head>

<body>

  <body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">ShopCart</a>

        <button class="btn btn-warning">
          🛒 Cart <span class="badge bg-dark">0</span>
        </button>
      </div>
    </nav>

    <div class="container py-4">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold">Products</h2>
          <p class="text-muted mb-0">Choose your favorite products</p>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="row g-3 mb-4">

        <div class="col-md-7">
          <input type="text" class="form-control" placeholder="Search product..." id="search">
        </div>

        <div class="col-md-5">
          <select class="form-select" id="category">
            <option value=" ">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Accessories">Accessories</option>
            <option value="Clothing">Clothing</option>
            <option value="Footwear">Footwear</option>
          </select>
        </div>

      </div>

      <div class="row">

        <!-- Products -->
        <div class="col-lg-8">
          <div class="row g-4" id="products">

            <!-- Product Card -->


          </div>
        </div>

        <!-- Cart -->
        <div class="col-lg-4 mt-4 mt-lg-0">

          <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
              <h5 class="mb-0">Shopping Cart</h5>
            </div>

            <div class="card-body" id="cart">

             

            </div>

            <div class="card-footer">

              <div class="d-flex justify-content-between fw-bold mb-3">
                <span>Total:</span>
                <span id="total">₹0</span>
              </div>

              <button class="btn btn-success w-100">
                Checkout
              </button>

            </div>
          </div>

        </div>

      </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>

</html>
